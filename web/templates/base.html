<!doctype html>
<html lang="{{ lang }}"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}JobHunter{% endblock %}</title>
<meta name="description" content="{{ t('hero_sub', n=19) }}">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>{{ css_tokens | safe }}</style>
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="logo" href="/" aria-label="JobHunter">
      <span class="logo-light">{{ logo_light | safe }}</span><span class="logo-dark">{{ logo_dark | safe }}</span>
    </a>
    <div class="links">
      <a href="/#como-funciona">{{ t('nav_how') }}</a>
      <a href="/#privacidad">{{ t('nav_privacy') }}</a>
    </div>
    <div class="navr">
      <button class="icon-btn" type="button" data-theme-toggle aria-label="{{ t('theme_label') }}">
        <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="seg" role="group" aria-label="{{ t('lang_label') }}">
        <a href="?lang=es" class="{{ 'on' if lang == 'es' }}" hreflang="es">ES</a>
        <a href="?lang=en" class="{{ 'on' if lang == 'en' }}" hreflang="en">EN</a>
      </div>
      {% block nav_cta %}<a class="btn btn-p" href="/empezar">{{ t('nav_cta') }}</a>{% endblock %}
    </div>
  </nav>
  {% block content %}{% endblock %}
</div>
</body>
</html>
