{# Carta de presentación de una oferta. Texto de la IA: lo escapa Jinja, nunca va como HTML. #}
{% if error %}
<p class="note-inline">{{ error }}</p>
{% else %}
<div class="letter">
  <div class="letter-h">
    <b>{{ t('cover_letter_expander') }}</b>
    <span class="sp"></span>
    <button class="link-btn" type="button" data-copy data-done="{{ t('btn_copied') }}">{{ t('btn_copy') }}</button>
    <button class="btn-link" type="button" data-toggle="letter-body-{{ id }}" aria-expanded="true"
            aria-controls="letter-body-{{ id }}">{{ t('btn_hide') }} <span class="caret" aria-hidden="true">▾</span></button>
  </div>
  <div class="collapse open" id="letter-body-{{ id }}"><div><pre>{{ letter }}</pre></div></div>
</div>
{% endif %}
